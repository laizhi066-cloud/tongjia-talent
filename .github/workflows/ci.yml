name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - base

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Run root quality gates
        run: pnpm qa

      - name: Check AI entry files
        run: pnpm check:ai

      - name: Type-check client
        run: pnpm client:typecheck

      - name: Lint client
        run: pnpm client:lint

      - name: Build platform edition
        run: pnpm build

      - name: Build client H5
        run: pnpm client:build:h5

      - name: Build client WeChat Mini Program
        run: pnpm client:build:mp
